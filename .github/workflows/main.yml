name: Build and Test

on: [push, pull_request]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
        name: Git Checkout
      - name: Set up JDK
        uses: actions/setup-java@v1
        with: 
          java-version: 21
      - name: Set up Docker
        uses: docker/setup-docker@v2
      - name: Run Gradle
        run:  ./gradlew check
