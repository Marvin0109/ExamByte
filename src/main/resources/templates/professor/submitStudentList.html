<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Übersicht aller Prüflinge für eine bestimmte Prüfung">
    <meta name="author" content="Marvin0109">
    <link rel="icon" href="/public/pictures/exambyteIcon.ico">

    <title>Exam</title>

    <link rel="stylesheet" href="/public/fontawesome-free-7.1.0-web/css/all.min.css">

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="/public/bootstrap-5.3.8-dist/css/bootstrap.min.css">

    <!-- Custom styles for this template -->
    <link rel="stylesheet" href="/public/custom/index.css">
</head>

<body>
<!-- Navigation -->
<header th:replace="~{navigation/navbar.html}"> </header>

<main role="main" class="container mt-5 pt-5">
    <h1> Teilnehmer der Prüfung </h1>

    <table class="table table-secondary table-striped">
        <thead>
        <tr>
            <th>Prüfling</th>
            <th>Bewertungsstatus</th>
            <th>Ergebnis</th>
            <th>Download</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="submitInfo: ${submitInfoList}">
            <td>
                <span th:text="${submitInfo.name}">Name des Prüflings</span>
            </td>
            <td>
                <span th:text="${submitInfo.reviewStatus ? '✔' : '✘'}"
                      th:style="${submitInfo.reviewStatus ? 'color:green;' : 'color:red;'}">
                </span>
            </td>
            <td>
                <form method="get"
                      th:action="@{/professor/showResult/{examId}/{studentName}
                      (examId=${exam.id}, studentName=${submitInfo.name})}">
                    <button type="submit" class="btn btn-secondary">
                        <i class="fas fa-eye"></i>
                        Ergebnis
                    </button>
                </form>
            </td>
            <td>
                <form method="get"
                      th:action="@{/professor/downloadReview/{examId}/{studentName}
                      (examId=${exam.id}, studentName=${submitInfo.name})}">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-download"></i>
                        Download
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<!-- Navigation -->
<header th:replace="~{navigation/navbarDown.html}"> </header>

<!-- js Imports -->
<script defer src="/public/bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>

</body>
</html>
